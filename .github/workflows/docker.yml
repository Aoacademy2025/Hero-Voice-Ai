# Build + push Docker image ขึ้น GitHub Container Registry (ghcr.io) อัตโนมัติ
# image: ghcr.io/aoacademy2025/hero-voice-ai:latest (และ :<commit sha>)
# ทริกเกอร์: push เข้า main ที่แตะโค้ด/Dockerfile หรือกดรันเองที่แท็บ Actions
name: docker

on:
  push:
    branches: [main]
    paths: [core/**, scripts/**, data/**, voices/**, voices_lao/**, OmniVoice/**, requirements.txt, Dockerfile, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # base image pytorch ~6GB + deps — runner มีที่ว่างไม่พอถ้าไม่ลบของที่ไม่ใช้ก่อน
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
