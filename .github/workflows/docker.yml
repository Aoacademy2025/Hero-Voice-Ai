# Build + push Docker images ขึ้น GitHub Container Registry (ghcr.io) อัตโนมัติ
#   ghcr.io/aoacademy2025/hero-voice-ai:latest      — HTTP server (Pod) โหลดโมเดลตอนสตาร์ทลง /workspace
#   ghcr.io/aoacademy2025/hero-voice-ai:serverless  — RunPod Serverless worker, ฝังโมเดลไว้ใน image
# ทริกเกอร์: push เข้า main ที่แตะโค้ด/Dockerfile หรือกดรันเองที่แท็บ Actions
name: docker

on:
  push:
    branches: [main]
    paths: [core/**, scripts/**, data/**, voices/**, voices_lao/**, OmniVoice/**, requirements.txt, Dockerfile, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: server
            tag: latest
            build_args: ""
          - variant: serverless
            tag: serverless
            build_args: |
              TTS_MODE_DEFAULT=serverless
              BAKE_MODELS=1
              MODELS_DIR=/models
    steps:
      # base image pytorch ~6GB + deps (+ โมเดล ~9GB สำหรับ serverless) — ลบของที่ไม่ใช้ก่อน
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ matrix.tag }}
            ${{ steps.img.outputs.name }}:${{ matrix.tag }}-${{ github.sha }}
          # layer โมเดล ~9GB ใหญ่เกิน GHA cache (10GB) — serverless ใช้ cache ของ server แค่ขาอ่าน
          cache-from: type=gha,scope=server
          cache-to: ${{ matrix.variant == 'server' && 'type=gha,scope=server,mode=max' || '' }}
